# Accès HTTP à l'API via Traefik : http://<IP de ops>/ (toutes les adresses)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskops-api
  namespace: taskops
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: taskops-api
                port:
                  name: http
