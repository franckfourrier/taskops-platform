# Autoscaling : 2 à 6 réplicas, cible 70 % du CPU demandé (requests: 100m)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: taskops-api
  namespace: taskops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: taskops-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
