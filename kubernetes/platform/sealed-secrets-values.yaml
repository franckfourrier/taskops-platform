# Sealed Secrets (chart sealed-secrets/sealed-secrets 2.22.0, contrôleur 0.41.2)
# Les Secrets sont chiffrés avec la clé publique du contrôleur (kubeseal) et peuvent
# être versionnés dans Git ; seul le contrôleur du cluster détient la clé privée.
# Nom attendu par défaut par kubeseal : sealed-secrets-controller dans kube-system
fullnameOverride: sealed-secrets-controller
resources:
  requests: {cpu: 20m, memory: 64Mi}
  limits: {memory: 256Mi}
# Pas de ServiceMonitor : le contrôleur est installé AVANT kube-prometheus-stack
# (qui a besoin du secret grafana-admin qu'il déchiffre), donc avant les CRD de Prometheus
