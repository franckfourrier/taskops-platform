# kube-prometheus-stack 93.5.0 — surveillance du cluster TaskOps (Kind, DEV)

# Kind : ces composants n'écoutent que sur 127.0.0.1 dans le nœud,
# Prometheus ne peut pas les joindre -> désactivés pour éviter de fausses alertes
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    # collecter les ServiceMonitor / règles de TOUS les namespaces (dont taskops)
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 7d
    retentionSize: 8GB
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {memory: 2Gi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests: {cpu: 20m, memory: 64Mi}
      limits: {memory: 256Mi}
    # Secret créé à la main (jamais dans Git), clé bot-token,
    # monté dans /etc/alertmanager/secrets/alertmanager-telegram/
    secrets:
      - alertmanager-telegram

  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: telegram
      group_by: [alertname, namespace]
      group_wait: 30s        # regroupe les alertes simultanées
      group_interval: 5m
      repeat_interval: 4h    # rappel si le problème dure
      routes:
        # Watchdog est toujours active (preuve que la chaîne vit) : jamais notifiée
        - receiver: "null"
          matchers: ['alertname = "Watchdog"']
        - receiver: "null"
          matchers: ['alertname = "InfoInhibitor"']
        # Kind sur VM : API Kubernetes lente (etcd), connu et documenté (panne n°9)
        - receiver: "null"
          matchers: ['alertname = "KubeAPIErrorBudgetBurn"']
    inhibit_rules:
      # une alerte critique masque l'avertissement du même nom
      - source_matchers: ['severity = "critical"']
        target_matchers: ['severity = "warning"']
        equal: [alertname, namespace]
    receivers:
      - name: "null"
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot-token
            chat_id: 2144233309      # identifiant de conversation (pas un secret)
            parse_mode: HTML
            send_resolved: true
            message: '{{ template "telegram.taskops" . }}'
    templates:
      - /etc/alertmanager/config/*.tmpl

  templateFiles:
    telegram.tmpl: |-
      {{ define "telegram.taskops" -}}
      {{ if eq .Status "firing" }}🔥 <b>ALERTE</b>{{ else }}✅ <b>RÉSOLU</b>{{ end }} : {{ .CommonLabels.alertname | html }}
      {{ range .Alerts }}
      <b>Gravité :</b> {{ .Labels.severity | html }}
      <b>Namespace :</b> {{ .Labels.namespace | html }}
      <b>Résumé :</b> {{ .Annotations.summary | html }}
      {{ .Annotations.description | html }}
      <b>Début :</b> {{ .StartsAt.Format "02/01 15:04 MST" }}
      {{ end }}
      {{- end }}

grafana:
  # mot de passe admin dans un Secret créé à la main, jamais dans Git
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsTimezone: Africa/Douala
  # HTTPS via Traefik, certificat émis par cert-manager (ClusterIssuer plateforme-ca)
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: plateforme-ca
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - grafana.10.10.10.13.nip.io
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.10.10.10.13.nip.io
  grafana.ini:
    server:
      root_url: https://grafana.10.10.10.13.nip.io
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
  # Premier démarrage lent sur la VM (migrations de la base Grafana) :
  # la sonde de vie par défaut (≈ 160 s) tuait Grafana avant la fin (panne n° 14)
  livenessProbe:
    httpGet:
      path: /api/health
      port: grafana
    initialDelaySeconds: 180
    timeoutSeconds: 30
    failureThreshold: 20

kube-state-metrics:
  # sonde par défaut trop stricte quand l'API Kubernetes est lente au démarrage
  livenessProbe:
    initialDelaySeconds: 30
    timeoutSeconds: 10
    failureThreshold: 6
