# Traefik (chart traefik/traefik) adapté à Kind :
# il tourne sur le nœud control-plane, qui expose les ports 80/443 de la machine hôte.
ports:
  web:
    hostPort: 80
  websecure:
    hostPort: 443
service:
  spec:
    type: ClusterIP
nodeSelector:
  ingress-ready: "true"
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
ingressClass:
  enabled: true
  isDefaultClass: true
# Kind : pas de LoadBalancer, Traefik publie donc une adresse fixe dans le statut des Ingress
# (nécessaire pour qu'Argo CD considère l'Ingress comme "Healthy")
providers:
  kubernetesIngress:
    publishedService:
      enabled: false
    ingressEndpoint:
      ip: "127.0.0.1"
# hostPort 80/443 : un seul pod Traefik peut tourner sur le nœud,
# il faut donc arrêter l'ancien AVANT de démarrer le nouveau lors d'une mise à jour
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0
