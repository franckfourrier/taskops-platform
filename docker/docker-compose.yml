# Environnement de dev local : API + PostgreSQL
# Lancer depuis la racine :  docker compose -f docker/docker-compose.yml up --build
name: taskops-platform

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tasks-dev-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: taskops-api:dev
    environment:
      DATABASE_URL: postgresql+psycopg://tasks:${POSTGRES_PASSWORD:-tasks-dev-only}@db:5432/tasks
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
