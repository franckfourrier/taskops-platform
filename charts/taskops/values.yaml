# ---------- API ----------
api:
  name: taskops-api
  replicaCount: 2
  image:
    repository: ghcr.io/franckfourrier/taskops-api
    tag: ""            # vide = appVersion du chart
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

# Secret créé hors du chart (jamais dans Git), clés : DATABASE_URL, POSTGRES_PASSWORD
existingSecret: taskops-db

# ---------- PostgreSQL ----------
postgres:
  enabled: true
  name: postgres
  image: postgres:17-alpine
  database: tasks
  user: tasks
  storage: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# ---------- Exposition ----------
ingress:
  enabled: true
  className: traefik
  host: ""             # vide = toutes les adresses
  # Liste blanche des chemins publiés : /metrics n'y figure PAS
  # (Prometheus le lit en interne via le Service, il ne doit pas être public)
  paths:
    - /tasks
    - /health
    - /docs
    - /openapi.json

# ---------- Autoscaling ----------
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# ---------- Disponibilité ----------
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ---------- Surveillance (projet 4, nécessite kube-prometheus-stack) ----------
monitoring:
  serviceMonitor:
    enabled: true        # Prometheus collecte /metrics de l'API
    interval: 30s
  prometheusRule:
    enabled: true        # alertes : API en panne, erreurs, latence, redémarrages
    errorRateThreshold: 0.05   # 5 % de réponses 5xx
    latencyP95Seconds: 0.5     # 500 ms au 95e centile
  dashboard:
    enabled: true        # tableau de bord Grafana chargé automatiquement
