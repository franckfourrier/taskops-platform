# ---------- API ----------
api:
  name: taskops-api
  replicaCount: 2
  image:
    repository: ghcr.io/franckfourrier/taskops-api
    tag: ""            # vide = appVersion du chart
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 320Mi
  # Injection de pannes (FAULT_RATE) : part des requêtes qui répondent 500 (0 = désactivée)
  faultRate: "0"
  # Livraison progressive (Argo Rollouts, projet 5) : canary jugé par Prometheus
  rollout:
    enabled: true
    weights: [33, 66]          # 1 pod sur 3, puis 2 sur 3, puis 100 % (arrondi supérieur)
    maxErrorRate: 0.05         # au-delà de 5 % de 5xx sur les pods canary : annulation
    prometheusAddress: http://kps-kube-prometheus-stack-prometheus.monitoring.svc:9090
  # Haute disponibilité : pods répartis sur les zones (label topology.kubernetes.io/zone)
  topologySpread:
    enabled: true
    zoneWhenUnsatisfiable: DoNotSchedule   # DoNotSchedule = règle stricte

# Mode sans CloudNativePG uniquement : Secret créé hors du chart (jamais dans Git),
# clés : DATABASE_URL, POSTGRES_PASSWORD
existingSecret: taskops-db

# ---------- PostgreSQL haute disponibilité (CloudNativePG, projet 5) ----------
cnpg:
  enabled: true
  name: taskops-pg
  instances: 3            # 1 primaire + 2 réplicas, un par zone
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-system-trixie
  database: tasks
  owner: tasks
  storage: 1Gi
  podMonitor: true        # métriques PostgreSQL collectées par Prometheus
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# ---------- PostgreSQL simple (ancien mode : 1 seule instance, sans bascule) ----------
postgres:
  enabled: false
  name: postgres
  image: postgres:17-alpine
  database: tasks
  user: tasks
  storage: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# ---------- Exposition ----------
ingress:
  enabled: true
  className: traefik
  host: ""             # vide = toutes les adresses
  # Liste blanche des chemins publiés : /metrics n'y figure PAS
  # (Prometheus le lit en interne via le Service, il ne doit pas être public)
  paths:
    - /tasks
    - /health
    - /docs
    - /openapi.json

# ---------- HTTPS (cert-manager, projet 5) ----------
tls:
  enabled: true
  # nip.io : nom DNS public qui résout vers l'adresse incluse (ici 10.10.10.13)
  host: taskops.10.10.10.13.nip.io
  duration: 2160h       # certificat valable 90 jours
  renewBefore: 720h     # renouvelé automatiquement 30 jours avant l'expiration

# ---------- Autoscaling ----------
autoscaling:
  enabled: true
  minReplicas: 3        # au moins 1 pod par zone
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# ---------- Disponibilité ----------
podDisruptionBudget:
  enabled: true
  minAvailable: 2        # une maintenance ne retire qu'un pod à la fois

# ---------- Surveillance (projet 4, nécessite kube-prometheus-stack) ----------
monitoring:
  serviceMonitor:
    enabled: true        # Prometheus collecte /metrics de l'API
    interval: 30s
  prometheusRule:
    enabled: true        # alertes : API en panne, erreurs, latence, redémarrages
    errorRateThreshold: 0.05   # 5 % de réponses 5xx
    latencyP95Seconds: 0.5     # 500 ms au 95e centile
  dashboard:
    enabled: true        # tableau de bord Grafana chargé automatiquement

# ---------- Pare-feu entre pods (projet 5) ----------
networkPolicy:
  enabled: true
  nodeCIDR: 172.18.0.0/16      # réseau Docker « kind » : nœuds, kubelet, API Kubernetes
  apiServer:
    serviceIP: 10.96.0.1       # Service kubernetes.default
    port: 6443                 # port réel de l'API sur le control-plane
