{{- if .Values.monitoring.prometheusRule.enabled }}
{{- $ns := .Release.Namespace }}
{{- $svc := .Values.api.name }}
# Alertes de l'API TaskOps, évaluées par Prometheus et envoyées à Alertmanager
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Values.api.name }}
  labels:
    {{- include "taskops.labels" . | nindent 4 }}
spec:
  groups:
    - name: taskops-api
      rules:
        - alert: TaskOpsAPIDown
          # aucun pod de l'API joignable par Prometheus
          expr: (sum(up{namespace="{{ $ns }}", service="{{ $svc }}"}) or vector(0)) == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "API TaskOps injoignable"
            description: "Aucune instance de l'API ne répond sur /metrics depuis 2 minutes."

        - alert: TaskOpsHighErrorRate
          expr: |
            sum(rate(taskops_http_requests_total{namespace="{{ $ns }}", status=~"5.."}[5m]))
              /
            sum(rate(taskops_http_requests_total{namespace="{{ $ns }}"}[5m]))
              > {{ .Values.monitoring.prometheusRule.errorRateThreshold }}
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Trop d'erreurs 5xx sur l'API TaskOps"
            description: {{`"{{ $value | humanizePercentage }} des requêtes échouent (5xx) depuis 5 minutes."`}}

        - alert: TaskOpsHighLatency
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(taskops_http_request_duration_seconds_bucket{namespace="{{ $ns }}"}[5m]))
            ) > {{ .Values.monitoring.prometheusRule.latencyP95Seconds }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "API TaskOps lente"
            description: {{`"Le 95e centile de latence est de {{ $value | humanizeDuration }} depuis 10 minutes."`}}

        - alert: TaskOpsPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="{{ $ns }}"}[15m]) > 2
          labels:
            severity: warning
          annotations:
            summary: "Un pod TaskOps redémarre en boucle"
            description: {{`"Le pod {{ $labels.pod }} ({{ $labels.container }}) a redémarré plus de 2 fois en 15 minutes."`}}
{{- end }}
