{{- if .Values.monitoring.serviceMonitor.enabled }}
# Indique à Prometheus (opérateur) de collecter /metrics sur le Service de l'API
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.api.name }}
  labels:
    {{- include "taskops.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.api.name }}
  # copie le label de révision du pod dans les métriques : permet de mesurer
  # séparément les pods canary (nouvelle version) et stables
  podTargetLabels:
    - rollouts-pod-template-hash
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
{{- end }}
