apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.api.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.api.name }}
    app.kubernetes.io/version: {{ .Values.api.image.tag | default .Chart.AppVersion | quote }}
    {{- include "taskops.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.api.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.api.name }}
    spec:
      {{- with .Values.api.topologySpread }}
      {{- if .enabled }}
      # Répartition des pods : au plus 1 pod d'écart entre zones (obligatoire)
      # et entre nœuds (au mieux) -> la perte d'une zone n'arrête pas l'API
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: {{ .zoneWhenUnsatisfiable }}
          # un nœud en panne (taint NotReady) n'est pas compté : le pod perdu
          # peut être recréé dans une autre zone
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $.Values.api.name }}
          matchLabelKeys: ["pod-template-hash"]
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $.Values.api.name }}
          matchLabelKeys: ["pod-template-hash"]
      {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- $db := include "taskops.db" . | fromYaml }}
      {{- if or .Values.cnpg.enabled .Values.postgres.enabled }}
      # Attend que PostgreSQL (primaire) accepte les connexions avant de démarrer l'API
      initContainers:
        - name: attente-postgres
          image: {{ $db.image }}
          command: ["sh", "-c", "until pg_isready -h {{ $db.host }} -p 5432 -U {{ $db.user }} -d {{ $db.name }}; do echo 'attente de PostgreSQL...'; sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      {{- end }}
      containers:
        - name: api
          image: {{ include "taskops.image" . }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- if .Values.cnpg.enabled }}
            # Identifiants générés par CloudNativePG (Secret <cluster>-app), aucun secret manuel
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cnpg.name }}-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cnpg.name }}-app
                  key: password
            # Service -rw : pointe toujours vers le primaire, même après une bascule
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(DB_USER):$(DB_PASSWORD)@{{ $db.host }}:5432/{{ $db.name }}"
            {{- else }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: DATABASE_URL
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
