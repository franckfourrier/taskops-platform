[project]
name = "taskops-api"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F : erreurs de base, I : tri des imports, B : bugs fréquents, UP : syntaxe moderne, S : sécurité
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert autorisé dans les tests

[tool.pytest.ini_options]
testpaths = ["tests"]
