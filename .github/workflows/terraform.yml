name: Terraform

on:
  pull_request:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:
    inputs:
      action:
        description: "Action sur l'environnement dev"
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read

# Jamais deux opérations Terraform en même temps sur dev, et jamais d'annulation en cours d'apply
concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  TF_VERSION: "1.17.2"
  AWS_REGION: eu-west-3
  PLAN_ROLE: arn:aws:iam::219806731917:role/taskops-gha-plan
  APPLY_ROLE: arn:aws:iam::219806731917:role/taskops-gha-apply
  BACKEND_CONFIG: envs/dev.s3.tfbackend

defaults:
  run:
    working-directory: terraform

jobs:
  validate:
    name: fmt, validate, tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform validate
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact

  plan:
    name: plan (dev)
    needs: validate
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # obtenir le jeton OIDC
      pull-requests: write  # commenter la PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Diagnostic OIDC (affiche le sujet du jeton, pas le jeton)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const t = await core.getIDToken('sts.amazonaws.com');
            const c = JSON.parse(Buffer.from(t.split('.')[1], 'base64url').toString());
            core.info(`sub = ${c.sub}`);
            core.info(`aud = ${c.aud}`);
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.PLAN_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform plan
        id: plan
        run: |
          terraform init -input=false -backend-config="$BACKEND_CONFIG"
          set -o pipefail
          terraform plan -input=false -no-color -lock-timeout=60s | tee plan.txt
      - name: Résumé du plan
        if: always()
        run: |
          {
            echo "### Terraform plan (dev)"
            echo '```'
            grep -E '^(Plan:|No changes|Error)' plan.txt || echo "(voir les logs)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commentaire sur la PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan-dev -->';
            let plan = fs.existsSync('terraform/plan.txt') ? fs.readFileSync('terraform/plan.txt', 'utf8') : 'plan.txt introuvable';
            if (plan.length > 60000) plan = '…(tronqué)…\n' + plan.slice(-60000);
            const summary = (plan.match(/^(Plan:.*|No changes.*)$/m) || ['voir les logs'])[0];
            const body = `${marker}\n### Terraform plan — dev\n**${summary}**\n\n<details><summary>Plan complet</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>\n\n_Commit ${context.sha.substring(0, 7)} — run [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const previous = comments.find(c => c.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  apply:
    name: apply (dev)
    needs: validate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    runs-on: ubuntu-latest
    environment: dev   # validation manuelle requise (Settings > Environments > dev)
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.APPLY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform apply
        run: |
          terraform init -input=false -backend-config="$BACKEND_CONFIG"
          terraform plan -input=false -no-color -lock-timeout=60s -out=tfplan
          terraform apply -input=false -no-color tfplan
      - name: Smoke test de l'API déployée
        run: |
          URL=$(terraform output -raw app_url)
          echo "URL : $URL" >> "$GITHUB_STEP_SUMMARY"
          for i in $(seq 1 30); do
            if curl -sf "$URL/health"; then echo; echo "API OK après $((i*10)) s" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
            sleep 10
          done
          echo "L'API ne répond pas après 5 minutes"; exit 1

  destroy:
    name: destroy (dev)
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.APPLY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform destroy
        run: |
          terraform init -input=false -backend-config="$BACKEND_CONFIG"
          terraform plan -destroy -input=false -no-color -lock-timeout=60s -out=destroy.tfplan
          terraform apply -input=false -no-color destroy.tfplan
